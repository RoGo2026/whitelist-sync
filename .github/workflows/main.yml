name: Скачивать, проверять и обновлять mobile-whitelist-1.txt (Мос.Хаб + GitVerse)

on:
  workflow_dispatch:
    inputs:
      retry:
        description: 'Служебный флаг повторного запуска (true = уже перезапуск)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v7

      - name: Сбор всех источников (URL, Локальные файлы, Base64)
        run: |
          mkdir -p ./downloads
          > mobile-whitelist-1.txt

          # 1. Обработка обычных ссылок из sources.txt
          if [ -f sources.txt ]; then
            echo "Обработка источников из sources.txt..."
            while IFS= read -r url || [ -n "$url" ]; do
              if [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]]; then
                continue
              fi
              url=$(echo "$url" | xargs)
              if [[ -n "$url" ]]; then
                filename="raw_$(date +%s%N)_$RANDOM.tmp"
                if curl -L -f --fail-early -o "./downloads/$filename" "$url"; then
                  grep -v '^[[:space:]]*#' "./downloads/$filename" | sed '/^$/d' >> mobile-whitelist-1.txt
                  echo "Добавлено из URL: $url"
                else
                  echo "Ошибка скачивания: $url" >&2
                fi
              fi
            done < sources.txt
          fi

          # 2. Добавление готовых ключей из локального файла VPN-Vless.txt
          if [ -f VPN-Vless.txt ]; then
            echo "Добавление готовых ключей из VPN-Vless.txt..."
            grep -v '^[[:space:]]*#' VPN-Vless.txt | sed '/^$/d' >> mobile-whitelist-1.txt
            echo "Локальные ключи из VPN-Vless.txt добавлены."
          else
            echo "Файл VPN-Vless.txt не найден, пропускаем."
          fi

          # 3. Декодирование Base64 из списка URL в Base64.txt
          if [ -f Base64.txt ]; then
            echo "Обработка Base64 источников из Base64.txt..."
            while IFS= read -r base64_url || [ -n "$base64_url" ]; do
              [[ -z "$base64_url" || "$base64_url" =~ ^[[:space:]]*# ]] && continue
              base64_url=$(echo "$base64_url" | xargs)
              if [[ -n "$base64_url" ]]; then
                b64_filename="b64_$(date +%s%N)_$RANDOM.tmp"
                echo "Скачивание Base64: $base64_url"
                if curl -L -f --fail-early --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o "./downloads/$b64_filename" "$base64_url"; then
                  base64 --decode "./downloads/$b64_filename" 2>/dev/null | grep -v '^[[:space:]]*#' | sed '/^$/d' >> mobile-whitelist-1.txt
                  echo "Base64 успешно декодирован: $base64_url"
                else
                  echo "Ошибка скачивания Base64: $base64_url" >&2
                fi
                rm -f "./downloads/$b64_filename"
              fi
            done < Base64.txt
          fi

          # Финальная очистка итогового файла
          sed -i '/^$/d' mobile-whitelist-1.txt

      - name: Сохранить собранный файл для проверки
        uses: actions/upload-artifact@v7
        with:
          name: raw-whitelist
          path: mobile-whitelist-1.txt

  test-and-filter:
    needs: collect-sources
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Скачать собранный файл
        uses: actions/download-artifact@v8
        with:
          name: raw-whitelist

      - name: Скачать и установить Xray-core
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -O xray.zip
          unzip -q xray.zip
          chmod +x xray
          sudo mv xray /usr/local/bin/
          echo "Xray-core установлен: $(xray version | head -n 1)"

      - name: Запустить проверку ссылок через Xray-core
        run: python3 check_links.py

      # ОСНОВНОЙ получатель: Мос.Хаб (hub.mos.ru) — гит-платформа на домене mos.ru
      - name: Обновить файл на Мос.Хаб (только рабочие ссылки)
        continue-on-error: true
        run: |
          CLONE_URL="https://oauth2:${{ secrets.WHITELIST_TOKEN }}@hub.mos.ru/84304/whitelist.git"

          # Клонирование с повторами: Mos.Hub периодически отвечает 502
          ok=0
          for i in $(seq 1 8); do
            echo "Клонирование Мос.Хаб, попытка $i..."
            rm -rf ./repo-mh
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone "$CLONE_URL" ./repo-mh; then
              ok=1
              break
            fi
            echo "Мос.Хаб не ответил (502/таймаут), повтор через $((i*10)) сек..."
            sleep $((i*10))
          done
          if [ "$ok" != "1" ]; then
            echo "ОШИБКА: не удалось клонировать Мос.Хаб после 8 попыток"
            exit 1
          fi

          # Если скрипт проверки выдал результат, берем его, иначе берем общий список
          if [ -f working_whitelist.txt ]; then
            cp -f working_whitelist.txt ./repo-mh/mobile-whitelist-1.txt
          else
            cp -f mobile-whitelist-1.txt ./repo-mh/mobile-whitelist-1.txt
          fi

          echo "# Last updated: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')" >> ./repo-mh/mobile-whitelist-1.txt

          cd ./repo-mh
          git config user.name "GitHub Action Bot"
          git config user.email "action@noreply.github.com"

          git add mobile-whitelist-1.txt

          if git commit -m "auto update checked whitelist $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')"; then
            pushed=0
            for i in $(seq 1 8); do
              git pull --rebase -X theirs origin main 2>/dev/null || true
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push в Мос.Хаб не удался (502/таймаут), повтор через $((i*10)) сек..."
              sleep $((i*10))
            done
            if [ "$pushed" != "1" ]; then
              echo "ОШИБКА: не удалось отправить файл на Мос.Хаб после 8 попыток"
              exit 1
            fi
            echo "✅ Файл с проверенными ссылками успешно отправлен на Мос.Хаб"
          else
            echo "Мос.Хаб: нет изменений после проверки"
          fi

      # РЕЗЕРВ: GitVerse (на случай, если Мос.Хаб недоступен)
      # ВРЕМЕННО ОТКЛЮЧЕНО: GitVerse недоступен (клонирование не удаётся). Только Мос.Хаб.
      - name: Обновить файл на GitVerse (резерв, только рабочие ссылки)
        if: false
        continue-on-error: true
        run: |
          CLONE_URL="https://RoGo:${{ secrets.GITVERSE_TOKEN }}@gitverse.ru/RoGo/mobile-whitelist.git"

          ok=0
          for i in $(seq 1 8); do
            echo "Клонирование GitVerse, попытка $i..."
            rm -rf ./repo-gv
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=60 clone "$CLONE_URL" ./repo-gv; then
              ok=1
              break
            fi
            echo "GitVerse не ответил, повтор через $((i*10)) сек..."
            sleep $((i*10))
          done
          if [ "$ok" != "1" ]; then
            echo "ОШИБКА: не удалось клонировать GitVerse после 8 попыток"
            exit 1
          fi

          # Если скрипт проверки выдал результат, берем его, иначе берем общий список
          if [ -f working_whitelist.txt ]; then
            cp -f working_whitelist.txt ./repo-gv/mobile-whitelist-1.txt
          else
            cp -f mobile-whitelist-1.txt ./repo-gv/mobile-whitelist-1.txt
          fi

          echo "# Last updated: $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')" >> ./repo-gv/mobile-whitelist-1.txt

          cd ./repo-gv
          git config user.name "GitHub Action Bot"
          git config user.email "action@noreply.github.com"

          git add mobile-whitelist-1.txt

          if git commit -m "auto update checked whitelist $(TZ='Europe/Moscow' date +'%Y-%m-%d %H:%M:%S МСК')"; then
            pushed=0
            for i in $(seq 1 8); do
              git pull --rebase -X theirs origin master 2>/dev/null || true
              if git push origin HEAD:master; then
                pushed=1
                break
              fi
              echo "Push в GitVerse не удался, повтор через $((i*10)) сек..."
              sleep $((i*10))
            done
            if [ "$pushed" != "1" ]; then
              echo "ОШИБКА: не удалось отправить файл на GitVerse после 8 попыток"
              exit 1
            fi
            echo "✅ Файл с проверенными ссылками успешно отправлен на GitVerse"
          else
            echo "GitVerse: нет изменений после проверки"
          fi

  auto-retry:
    name: Повторный запуск workflow при ошибке (один раз)
    needs: [collect-sources, test-and-filter]
    if: ${{ !cancelled() && inputs.retry != 'true' && (needs.collect-sources.result == 'failure' || needs.test-and-filter.result == 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - name: Перезапустить workflow (одна повторная попытка)
        run: |
          echo "Ожидание перед повторным запуском. Можно отменить — ожидание прервётся сразу."
          for i in $(seq 1 15); do
            sleep 10
            st=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 | tr -d ' \n')
            echo "ожидание $((i*10)) c..."
            if echo "$st" | grep -q '"status":"completed"'; then
              echo "Запуск отменён/завершён — повторный запуск не выполняю."
              exit 0
            fi
          done
          curl -sS -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main","inputs":{"retry":"true"}}'
